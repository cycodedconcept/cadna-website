name: CI/CD

# Save as .github/workflows/ci-cd.yml
#
# Cadna is a static site: everything is built here and the finished files are
# copied into the document root on Truehost. Nothing runs on the server, so
# there is no Node version to match, no Passenger app, and nothing to restart.
#
# Pull requests -> build only, as a safety net.
# Push to main  -> build, then publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- build
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Anything the site needs at build time goes here. These values end
          # up inside the shipped JavaScript, so only put public ones here.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Vite -> dist, Create React App -> build, Next.js export -> out.
      # Set a BUILD_DIR repo variable if yours is none of those.
      - name: Locate build output
        id: out
        env:
          BUILD_DIR: ${{ vars.BUILD_DIR }}
        run: |
          if [ -n "$BUILD_DIR" ]; then
            dir="$BUILD_DIR"
          elif [ -d dist ]; then dir=dist
          elif [ -d build ]; then dir=build
          elif [ -d out ]; then dir=out
          else
            echo "::error::No build output found. Set the BUILD_DIR repo variable."
            exit 1
          fi
          if [ ! -f "$dir/index.html" ]; then
            echo "::error::$dir has no index.html - is that really the build output?"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing from $dir ($(find "$dir" -type f | wc -l) files)"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ steps.out.outputs.dir }}/
          retention-days: 7

  # ---------------------------------------------------------------- publish
  publish:
    name: Publish to Truehost
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TRUEHOST_SSH_KEY }}
          SSH_HOST: ${{ secrets.TRUEHOST_HOST }}
          SSH_PORT: ${{ secrets.TRUEHOST_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delay-updates stages every file on the server first and moves them
      # into place at the end, so visitors never catch the site half-swapped.
      #
      # The excludes protect paths cPanel owns. .well-known in particular holds
      # the Let's Encrypt challenge files - delete those and SSL renewal breaks.
      - name: Publish
        env:
          SSH_HOST: ${{ secrets.TRUEHOST_HOST }}
          SSH_PORT: ${{ secrets.TRUEHOST_SSH_PORT }}
          SSH_USER: ${{ secrets.TRUEHOST_USER }}
          DOC_ROOT: ${{ vars.DOC_ROOT }}
        run: |
          rsync -az --delete --delay-updates \
            --exclude='cgi-bin/' \
            --exclude='.well-known/' \
            --exclude='.htpasswd' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$DOC_ROOT/"

      - name: Verify
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL")
          if [ "$code" != "200" ]; then
            echo "::error::$APP_URL returned $code"
            exit 1
          fi
          echo "OK - $APP_URL is serving"
