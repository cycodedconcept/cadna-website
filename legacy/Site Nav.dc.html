<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Expanded:wght@600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}a{color:#fff;text-decoration:none}a:hover{color:#1877F2}</style>
</helmet>
<div style="width:100%;font-family:'Archivo',sans-serif;position:sticky;top:0;z-index:60;background:rgba(0,0,0,0.94);backdrop-filter:blur(10px);border-bottom:1px solid #141414;box-sizing:border-box">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:14px;padding:16px clamp(16px,4vw,56px)">
    <a href="CADNA%20Landing.dc.html" style="display:flex;align-items:center"><img src="assets/cadna-logo-white.png" alt="CADNA GSL" style="height:30px"></a>
    <div style="display:flex;align-items:center;gap:clamp(14px,2.2vw,30px);flex-wrap:wrap;justify-content:flex-end;font-size:13px;letter-spacing:0.08em;color:#999">
      <div style="position:relative" onMouseEnter="{{ openDd }}" onMouseLeave="{{ closeDd }}">
        <div style="display:flex;align-items:center;gap:7px;cursor:pointer;color:{{ servicesColor }};letter-spacing:0.08em" onClick="{{ toggleDd }}">
          <span>SERVICES</span>
          <svg width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="transform:rotate({{ caretRot }});transition:transform 0.2s ease"><path d="M1 1.5L5 5 9 1.5"></path></svg>
        </div>
        <div style="position:absolute;top:calc(100% + 14px);right:0;display:{{ ddDisplay }};background:#08080b;border:1px solid #1e1e24;border-radius:10px;padding:10px;width:min(86vw,340px);box-shadow:0 24px 60px rgba(0,0,0,0.7);flex-direction:column;gap:2px">
          <sc-for list="{{ divisions }}" as="d" hint-placeholder-count="4">
            <a href="{{ d.href }}" style="display:flex;gap:13px;padding:13px 14px;border-radius:7px;color:#fff;letter-spacing:0;align-items:flex-start" style-hover="background:#12121a;color:#fff">
              <span style="font-family:'Archivo Expanded','Archivo',sans-serif;font-size:12px;font-weight:700;color:#1877F2;padding-top:3px">{{ d.num }}</span>
              <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
                <span style="font-size:14.5px;font-weight:600">{{ d.name }}</span>
                <span style="font-size:12.5px;color:#8b8b93;line-height:1.45">{{ d.blurb }}</span>
              </span>
            </a>
          </sc-for>
          <a href="Packages.dc.html" style="display:block;margin-top:6px;padding:12px 14px;border-top:1px solid #1a1a20;font-size:13px;color:#1877F2;letter-spacing:0;font-weight:600" style-hover="color:#fff">See packages &amp; pricing →</a>
        </div>
      </div>
      <a href="About.dc.html" style="color:{{ aboutColor }}" style-hover="color:#fff">ABOUT</a>
      <a href="Packages.dc.html" style="color:{{ packagesColor }}" style-hover="color:#fff">PACKAGES</a>
      <a href="FAQ.dc.html" style="color:{{ faqColor }}" style-hover="color:#fff">FAQ</a>
      <a href="Contact.dc.html" style="color:{{ contactColor }}" style-hover="color:#fff">CONTACT</a>
      <a href="Make%20a%20Request.dc.html" style="background:#1877F2;color:#fff;font-weight:600;padding:11px 22px;border-radius:2px;letter-spacing:0" style-hover="background:#0f66d8;color:#fff">Make a Request</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:220},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;home&quot;,&quot;services&quot;,&quot;about&quot;,&quot;packages&quot;,&quot;faq&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { dd: false };
  renderVals() {
    const active = this.props.active || '';
    const on = '#fff', off = '#999';
    return {
      divisions: [
        { num: '01', name: 'Business Concierge', blurb: 'Setup, structuring, growth strategy, market entry', href: 'Business%20Concierge.dc.html' },
        { num: '02', name: 'Financial Concierge', blurb: 'Debt, equity, trade finance, funding readiness', href: 'Financial%20Concierge.dc.html' },
        { num: '03', name: 'Education Concierge', blurb: 'Training, coaching, mentorship, corporate academies', href: 'Education%20Concierge.dc.html' },
        { num: '04', name: 'Technology Concierge', blurb: 'Web, apps, automation, AI tools, transformation', href: 'Technology%20Concierge.dc.html' }
      ],
      openDd: () => this.setState({ dd: true }),
      closeDd: () => this.setState({ dd: false }),
      toggleDd: () => this.setState(s => ({ dd: !s.dd })),
      ddDisplay: this.state.dd ? 'flex' : 'none',
      caretRot: this.state.dd ? '180deg' : '0deg',
      servicesColor: (this.state.dd || active === 'services') ? on : off,
      aboutColor: active === 'about' ? on : off,
      packagesColor: active === 'packages' ? on : off,
      faqColor: active === 'faq' ? on : off,
      contactColor: active === 'contact' ? on : off
    };
  }
}
</script>
</body>
</html>
